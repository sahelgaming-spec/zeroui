<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #0A0A0F;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 90px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .eyebrow {
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #6EE7B7;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 52px;
    font-weight: 600;
    line-height: 1.1;
    color: #F9FAFB;
    max-width: 900px;
    margin-bottom: 32px;
  }
  .sub {
    font-size: 20px;
    color: #6B7280;
    max-width: 700px;
    line-height: 1.5;
  }
  .logo-img {
    position: absolute;
    bottom: 44px;
    right: 72px;
    height: 56px;
    width: auto;
  }
  .accent-line {
    width: 48px;
    height: 2px;
    background: #6EE7B7;
    margin-bottom: 32px;
  }
</style>
</head>
<body>
  <div class="accent-line"></div>
  <p class="eyebrow">GitHub · GitLab · Azure DevOps · Policy-as-code · Agent-aware</p>
  <h1>AI agent opened a PR.<br>Did the right person<br>review it?</h1>
  <p class="sub">Policy and review enforcement for AI agent PRs — automatic, auditable, GitHub-native.</p>
  <img src="./zeroui-logo-transparent.png" class="logo-img" alt="ZeroUI" />
</body>
</html>
